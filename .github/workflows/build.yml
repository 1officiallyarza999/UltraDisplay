name: UltraDisplay - Build APK

on:
  push:
    branches: [main, 'wip/**']
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # The default package list of setup-android includes "tools",
      # which no longer exists in the Android SDK and fails the build.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Keep the same debug signing key between builds (stored in the repo's private Actions cache,
      # not in the code) so a new APK installs over the previous one instead of being rejected.
      - name: Restore debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: ultradisplay-debug-keystore-v1

      - name: Build APK
        run: |
          set -o pipefail
          gradle assembleDebug --console=plain 2>&1 | tee build.log

      # Surface compiler errors as annotations so they are readable without downloading logs.
      - name: Report build errors
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong|AAPT|Execution failed" build.log | head -40 > errors.txt || true
          echo "::error title=Build errors::$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' errors.txt)"

      # Static analysis: crashes from API levels, permissions, manifest problems.
      - name: Lint
        if: always()
        continue-on-error: true
        run: |
          gradle lintDebug --console=plain -Dlint.baselines.continue=true > lint.log 2>&1 || true
          F=app/build/reports/lint-results-debug.txt
          if [ -f "$F" ]; then
            grep -E "Error:|Warning: .*(NewApi|InlinedApi|MissingPermission|ForegroundService|UnspecifiedRegisterReceiverFlag|WrongConstant|Range|ResourceType|MissingClass|Instantiatable)" "$F" | head -40 > lint-top.txt || true
            echo "::warning title=Lint::$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' lint-top.txt)"
          else
            tail -30 lint.log
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UltraDisplay-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
